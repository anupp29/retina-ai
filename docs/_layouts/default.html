<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title | default: "Retina AI Documentation" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #334155;
            --heading-color: #0f172a;
            --accent-color: #3b82f6;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --rationale-bg: #eff6ff;
            --rationale-border: #bfdbfe;
            --rationale-text: #1e3a8a;
            --rationale-title: #1d4ed8;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.7;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .content-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            padding: 50px 60px;
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--heading-color);
            margin-top: 2em;
            margin-bottom: 0.75em;
            font-weight: 600;
            line-height: 1.3;
        }

        h1 {
            font-size: 2.25rem;
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        h2 {
            font-size: 1.75rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        h3 {
            font-size: 1.35rem;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #2563eb;
            text-decoration: underline;
        }

        p {
            margin-bottom: 1.5em;
        }

        ul, ol {
            margin-bottom: 1.5em;
            padding-left: 1.5em;
        }

        li {
            margin-bottom: 0.5em;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 2em auto;
        }

        code {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            background-color: #f1f5f9;
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-size: 0.9em;
            color: #d926a9;
        }

        pre {
            background-color: #1e293b;
            color: #f8fafc;
            padding: 1.5em;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 1.5em;
        }

        pre code {
            background-color: transparent;
            padding: 0;
            color: inherit;
        }

        blockquote {
            border-left: 4px solid var(--accent-color);
            margin: 1.5em 0;
            padding: 0.5em 0 0.5em 1.5em;
            color: #475569;
            font-style: italic;
            background-color: #f8fafc;
            border-radius: 0 8px 8px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5em;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
            font-weight: 600;
        }

        /* Design Choice Rationale Block */
        .rationale-block {
            background-color: var(--rationale-bg);
            border-left: 4px solid var(--accent-color);
            border-radius: 8px;
            padding: 20px 25px;
            margin: 2em 0;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.05);
        }

        .rationale-title {
            color: var(--rationale-title);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .rationale-title::before {
            content: "💡";
            margin-right: 8px;
            font-size: 1.1rem;
        }

        .rationale-content {
            color: var(--rationale-text);
            margin: 0;
            font-size: 0.95rem;
        }

        hr {
            border: 0;
            height: 1px;
            background: var(--border-color);
            margin: 3em 0;
        }

        @media (max-width: 768px) {
            .content-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content-card">
            {{ content }}
        </div>
    </div>

    <!-- Mermaid JS Configuration -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({
            startOnLoad: true,
            theme: 'default',
            fontFamily: 'Inter, sans-serif'
        });
    </script>
</body>
</html>
